# Mantém o projeto Supabase acordado: o free tier pausa após ~1 semana sem
# atividade de API (foi o que derrubou o backstage em 23/08/2026). Dois pings
# por semana contam como atividade e evitam a pausa.
#
# A anon key abaixo é pública por design (a mesma de js/config.js) — a
# segurança real está nas regras RLS do Postgres.
#
# Se o projeto pausar mesmo assim (ex.: GitHub desativa crons após 60 dias
# sem atividade no repositório), este job falha e o GitHub avisa por e-mail;
# basta restaurar o projeto no painel do Supabase e rodar o workflow à mão
# (aba Actions → Keep Supabase awake → Run workflow).

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * 1,4" # segunda e quinta, 03:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping na API REST do Supabase
        env:
          SUPABASE_URL: https://lpadlajkeqepdabitgvp.supabase.co
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwYWRsYWprZXFlcGRhYml0Z3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3ODU5OTgsImV4cCI6MjA5OTM2MTk5OH0.OqRzbURsbBCQ3fei-NDgllXNKaXICZoSV1lC7aTlPp0
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/songs?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -o /dev/null -w "HTTP %{http_code}\n"
